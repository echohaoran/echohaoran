  <text x="425" y="88" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="44" font-weight="700" fill="url(#neon)" letter-spacing="12">ECHO HAORAN</text>
  <text x="425" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e" letter-spacing="7">FDE  //  AIOPS</text>
